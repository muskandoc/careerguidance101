<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentor Connect</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14181f;--mute:#5b6663;--line:#d9dedc;--accent:#0f5c5c;--accent-ink:#fff;--soft:#d8ebe8;--err:#a8321f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151a;--card:#1a2128;--ink:#eef2f1;--mute:#9db0ac;--line:#2f3a40;--accent:#5fc4b8;--accent-ink:#0b1514;--soft:#1f3a38;--err:#ff8a75;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151a;--card:#1a2128;--ink:#eef2f1;--mute:#9db0ac;--line:#2f3a40;--accent:#5fc4b8;--accent-ink:#0b1514;--soft:#1f3a38;--err:#ff8a75;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 20px 60px}
h1{font:600 30px/1.2 "Iowan Old Style",Georgia,serif;margin:0 0 6px}
h2{font:600 20px/1.3 "Iowan Old Style",Georgia,serif;margin:0}
.sub{color:var(--mute);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.meta{color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);color:var(--ink);border-radius:99px;padding:2px 10px;font-size:13px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.card .btn{margin-top:auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px}
.day{font-weight:600;margin-bottom:6px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:default}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.err{color:var(--err);font-size:14px;min-height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ok{border-left:5px solid var(--accent)}
.booked{margin-top:32px}
.booked li{margin:4px 0}
.note{color:var(--mute);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<main id="app"></main>
<script>
// Three mentors taken from the provided Mentor_Sample_50 sheet. Only fields present in the sheet are shown.
const MENTORS=[
 {id:"M009",name:"Mentor 009",domain:"Business Generalist",level:"Mid-career",city:"Bengaluru",roles:["Growth","Founder’s Office"],sectors:["Fintech","Logistics","Edtech"],note:"Rated excellent · 8 mentoring activities",kw:["growth","startup","founder","strategy","operations","business","fintech","logistics","edtech","scale","chief of staff"]},
 {id:"M010",name:"Mentor 010",domain:"Marketing",level:"Senior",city:"Bengaluru",roles:["Marketing"],sectors:["Edtech","HR-tech","Consulting"],note:"Rated good · 7 mentoring activities",kw:["marketing","brand","content","edtech","hr","consulting","social","seo","campaign","communication"]},
 {id:"M021",name:"Mentor 021",domain:"Product Management",level:null,city:"Bengaluru",roles:["Product Management","AI and Analytics"],sectors:["E-commerce","Fintech","SaaS","Edtech","Deeptech/AI"],note:"Lists AI experience (n8n, Make)",kw:["product","pm","ai","analytics","data","ecommerce","e-commerce","saas","fintech","edtech","automation","machine learning","apm"]}
];
const TIMES=["10:00","14:30","18:30"];
const app=document.getElementById("app");
let state={view:"problem",problem:"",mentor:null,slot:null,error:""};

// Bookings are kept in this browser only (localStorage), so a slot you book is blocked on your next visit.
function load(){try{return JSON.parse(localStorage.getItem("mc_bookings")||"[]")}catch(e){return[]}}
function save(b){try{localStorage.setItem("mc_bookings",JSON.stringify(b))}catch(e){}}
let bookings=load();

function days(){ // next 5 days, IST labels
  const out=[];const base=new Date();
  for(let i=1;i<=5;i++){const d=new Date(base.getTime()+i*86400000);
    const key=d.toISOString().slice(0,10);
    out.push({key,label:d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})});}
  return out;
}
const taken=(m,key,t)=>bookings.some(b=>b.mentorId===m&&b.date===key&&b.time===t);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if(state.view==="problem")return problem();
  if(state.view==="list")return list();
  if(state.view==="book")return book();
  if(state.view==="done")return done();
}

function rank(text){
  const t=" "+text.toLowerCase()+" ";
  return MENTORS.map(m=>{
    const hits=m.kw.filter(k=>new RegExp("(^|[^a-z])"+k.replace(/[-]/g,"[- ]?")+"([^a-z]|$)").test(t));
    return {m,hits,score:hits.length};
  }).sort((a,b)=>b.score-a.score);
}

function problem(){
  app.innerHTML=`<h1>What are you stuck on in your career?</h1>
  <p class="sub">Describe it in a few sentences. We’ll show you which of our mentors can help, and you can book a call with them.</p>
  <div class="panel">
    <label>Your career problem<textarea id="prob" rows="6" placeholder="For example: I’m a final-year student and want to move into product management at a fintech, but I have no PM experience.">${esc(state.problem)}</textarea></label>
    <div class="err" id="perr" role="alert"></div>
    <div class="row"><button class="btn" id="find">Find mentors</button></div>
  </div>`;
  document.getElementById("find").onclick=()=>{
    const v=document.getElementById("prob").value.trim();
    if(v.length<15){document.getElementById("perr").textContent="Add a bit more detail (a sentence or two) so we can suggest the right mentors.";return}
    state={...state,view:"list",problem:v};render();window.scrollTo(0,0);
  };
}

function list(){
  const ranked=rank(state.problem||""),any=ranked[0].score>0;
  app.innerHTML=`<p><button class="btn ghost" id="edit">Edit my problem</button></p>
  <h1>You can schedule a call with these mentors</h1>
  <p class="sub">${any?"Based on what you told us, these mentors are the closest fit, best match first.":"We couldn’t spot a clear match from your description, so here are all our mentors. Pick whoever sounds closest, or edit your problem to add detail."} Calls are 30 minutes on your own video link.</p>
  <div class="card" style="margin-bottom:16px"><div class="meta">Your problem</div><div>${esc(state.problem)}</div></div>
  <div class="grid">${ranked.map(({m,hits})=>`<article class="card">
    <div><h2>${esc(m.name)}</h2><div class="meta">${esc(m.domain)}${m.level?" · "+esc(m.level):""} · ${esc(m.city)}</div></div>
    <div class="chips">${m.sectors.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div>
    <div class="meta">Can help with: ${m.roles.map(esc).join(", ")}</div>
    <div class="meta">${esc(m.note)}</div>
    ${hits.length?`<div class="meta"><b>Why:</b> your description mentions ${hits.map(esc).join(", ")}, which appears in this mentor’s listed experience.</div>`:""}
    <button class="btn" data-m="${m.id}">Book a call</button></article>`).join("")}</div>
  ${bookings.length?`<section class="booked"><h2>Your booked calls</h2><ul>${bookings.map(b=>`<li>${esc(b.mentorName)} · ${esc(b.dateLabel)}, ${esc(b.time)} IST</li>`).join("")}</ul></section>`:""}
  <p class="note">Mentors shown are from the provided mentor list. Available times are sample slots for this assignment.</p>`;
  document.getElementById("edit").onclick=()=>{state.view="problem";render()};
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state={...state,view:"book",mentor:MENTORS.find(m=>m.id===b.dataset.m),slot:null,error:""};render();window.scrollTo(0,0)});
}

const $f=id=>document.getElementById(id);
function keepForm(){return {n:$f("name").value,e:$f("email").value,t:$f("topic").value}}
function restoreForm(k){$f("name").value=k.n;$f("email").value=k.e;$f("topic").value=k.t}
function book(){
  const m=state.mentor;
  app.innerHTML=`<p><button class="btn ghost" id="back">Back</button></p>
  <h1>Book ${esc(m.name)}</h1><p class="sub">${esc(m.domain)} · ${m.sectors.map(esc).join(", ")}</p>
  <div class="panel">
    <div>${days().map(d=>`<div style="margin-bottom:14px"><div class="day">${esc(d.label)}</div><div class="slots">${TIMES.map(t=>{
      const off=taken(m.id,d.key,t),sel=state.slot&&state.slot.key===d.key&&state.slot.time===t;
      return `<button class="slot" data-k="${d.key}" data-l="${esc(d.label)}" data-t="${t}" aria-pressed="${!!sel}" ${off?"disabled":""}>${t}${off?" (booked)":""}</button>`}).join("")}</div></div>`).join("")}</div>
    <label>Your name<input id="name" autocomplete="name"></label>
    <label>Email<input id="email" type="email" autocomplete="email"></label>
    <label>What do you want help with?<textarea id="topic" rows="3" placeholder="A sentence or two is enough">${esc(state.problem||"")}</textarea></label>
    <div class="err" id="err" role="alert">${esc(state.error)}</div>
    <div class="row"><button class="btn" id="confirm">Confirm booking</button><span class="meta">Times are in IST</span></div>
  </div>`;
  document.getElementById("back").onclick=()=>{state.view="list";render()};
  app.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{state.slot={key:b.dataset.k,label:b.dataset.l,time:b.dataset.t};
    const keep=keepForm();book();restoreForm(keep)});
  document.getElementById("confirm").onclick=()=>{
    const n=$f("name").value.trim(),e=$f("email").value.trim(),t=$f("topic").value.trim();
    let err="";
    if(!state.slot)err="Pick a time first.";
    else if(!n)err="Enter your name.";
    else if(!/^\S+@\S+\.\S+$/.test(e))err="Enter a valid email address.";
    else if(!t)err="Tell the mentor briefly what you want help with.";
    else if(taken(m.id,state.slot.key,state.slot.time))err="That time was just taken. Pick another.";
    if(err){state.error=err;const keep=keepForm();book();restoreForm(keep);return}
    const rec={mentorId:m.id,mentorName:m.name,date:state.slot.key,dateLabel:state.slot.label,time:state.slot.time,student:n,email:e,topic:t};
    bookings=[...bookings,rec];save(bookings);state={...state,view:"done",mentor:m,slot:null,last:rec,error:""};render();window.scrollTo(0,0);
  };
}

function done(){
  const r=state.last;
  app.innerHTML=`<div class="panel ok"><h1>You’re booked</h1>
    <p>${esc(r.student)}, your call with <b>${esc(r.mentorName)}</b> is on <b>${esc(r.dateLabel)} at ${esc(r.time)} IST</b>.</p>
    <div class="card" style="border-left:5px solid var(--accent)"><b>What happens next</b>
      <div>Your mentor will send the meeting link to your registered email address, <b>${esc(r.email)}</b>, before the call. Please keep an eye on your inbox, including spam.</div></div>
    <div><b>What you asked about</b><div class="meta">${esc(r.topic)}</div></div>
    <div class="row"><button class="btn" id="again">Book another call</button></div></div>`;
  document.getElementById("again").onclick=()=>{state={view:"problem",problem:""};render()};
}
render();
</script>
</body>
</html>
